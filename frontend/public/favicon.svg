<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBB6C" />
      <stop offset="50%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#9A6A18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with subtle champagne border -->
  <circle cx="32" cy="32" r="30" fill="#FAF7F0" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Perfume Flacon Silhouette -->
  <!-- Cap -->
  <rect x="27" y="10" width="10" height="7" rx="1.5" fill="url(#goldGrad)" />
  <rect x="29" y="17" width="6" height="3" fill="#DFBB6C" />
  
  <!-- Bottle Body -->
  <path d="M19 22 C19 20, 45 20, 45 22 L47 48 C47 52, 44 54, 40 54 L24 54 C20 54, 17 52, 17 48 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner EP Monogram -->
  <text x="32" y="42" font-family="'Playfair Display', serif" font-weight="700" font-size="16" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">EP</text>
  <circle cx="32" cy="47" r="1.5" fill="#C89B3C" />
</svg>